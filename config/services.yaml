parameters:
    env(DATABASE_VERSION): '15.0.0'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\:
        resource: '../src/Controller/'

    App\Service\:
        resource: '../src/Service/'

    App\OpenApi\PasswordResetOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            - '@App\OpenApi\PasswordResetOpenApiFactory.inner'
        autoconfigure: false

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Controller/'
            - '../src/Service/'
            - '../src/Entity/'
            - '../src/Kernel.php'
