name: Tests

on:
  push:
    branches:
      - develop
      - main

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: running_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d running_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: ci_test_secret
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: running_tracker_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_VERSION: "15"
      MAILER_DSN: null://null
      MAILER_FROM: no-reply@example.test
      CONTACT_EMAIL_TO: contact@example.test
      GEO_KEY: test
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      GOOGLE_REDIRECT_URI: http://localhost/connect/google/check
      CORS_ALLOW_ORIGIN: ^https?://localhost$
      DEFAULT_URI: http://localhost
      JWT_SECRET_KEY: ${{ github.workspace }}/config/jwt/private.pem
      JWT_PUBLIC_KEY: ${{ github.workspace }}/config/jwt/public.pem
      JWT_PASSPHRASE: test
      JWT_TTL: 3600
      COVERAGE_MIN_LINES_SOFT: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate JWT keys for test environment
        run: |
          mkdir -p config/jwt
          openssl genrsa -aes256 -passout pass:${JWT_PASSPHRASE} -out config/jwt/private.pem 2048
          openssl rsa -pubout -passin pass:${JWT_PASSPHRASE} -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p var/coverage
          php bin/phpunit --configuration phpunit.xml.dist \
            --coverage-text \
            --coverage-clover var/coverage/clover.xml \
            --coverage-html var/coverage/html

      - name: Report coverage soft target
        run: |
          php -r '$min=(float)getenv("COVERAGE_MIN_LINES_SOFT"); $xml=simplexml_load_file("var/coverage/clover.xml"); if(!$xml){echo "::warning::Unable to parse clover.xml for coverage summary."; exit(0);} $metrics=$xml->project->metrics; $statements=(int)$metrics["statements"]; $covered=(int)$metrics["coveredstatements"]; $rate=$statements>0?($covered*100/$statements):0; printf("Line coverage: %.2f%% (%d/%d)\n",$rate,$covered,$statements); if($rate<$min){echo "::warning::Line coverage below soft target {$min}% (current ".number_format($rate,2)."%)."; }'

     # - name: Sonar scan
     #   uses: SonarSource/sonarqube-scan-action@v4
      #  env:
       #   SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        #  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: |
            var/coverage/clover.xml
            var/coverage/html
          if-no-files-found: warn

