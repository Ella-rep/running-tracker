name: Bump Composer Version

on:
  push:
    branches:
      - develop  # ou la branche par défaut de ton projet

jobs:
  bump-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # nécessaire pour pousser commit et tag

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour récupérer l'historique complet

      # 2. Installation de jq pour manipuler composer.json
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Détection du type de bump
      # En Conventional Commits, on utilise :
      # feat: → nouvelle fonctionnalité (minor)
      # fix: → correction de bug (patch)
      # BREAKING CHANGE: ou feat!: → changement majeur (major)
      # chore: → tâches internes (ex. bump de version)
      - name: Detect bump type
        id: bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qE "BREAKING CHANGE|major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMIT_MSG" | grep -qE "^feat|minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elseif echo "$COMMIT_MSG" | grep -qE "^fix|patch"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=chore" >> $GITHUB_OUTPUT
          fi

      # 4. Lecture et calcul de la nouvelle version
      - name: Bump version in composer.json
        id: version
        run: |
          FILE="composer.json"
          CURRENT_VERSION=$(jq -r '.version' "$FILE")
          if [ "$CURRENT_VERSION" = "null" ]; then
            echo "composer.json n'a pas de champ 'version'."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ steps.bump.outputs.type }}" in
            major)
              ((MAJOR++)); MINOR=0; PATCH=0 ;;
            minor)
              ((MINOR++)); PATCH=0 ;;
            patch)
              ((PATCH++)) ;;
            chore)
              ((PATCH++)) ;;  # on peut aussi choisir de ne pas bump du tout pour les chores
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          jq --arg v "$NEW_VERSION" '.version = $v' "$FILE" > tmp.json && mv tmp.json "$FILE"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version bumped: $CURRENT_VERSION → $NEW_VERSION"

      # 5. Commit 
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TYPE="${{ steps.bump.outputs.type }}"
          VERSION="${{ steps.version.outputs.new_version }}"

          case "$TYPE" in
            major)
              COMMIT_MSG="chore(release): bump version to $VERSION [major]" ;;
            minor)
              COMMIT_MSG="chore(release): bump version to $VERSION [minor]" ;;
            patch)
              COMMIT_MSG="chore(release): bump version to $VERSION [patch]" ;;
          esac

          git add composer.json
          git commit -m "$COMMIT_MSG"
          git tag -a "v$VERSION" -m "Release $VERSION"

          git push origin HEAD:develop
          git push origin "v$VERSION"